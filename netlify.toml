[build]
  # Genera el site amb Eleventy (llegeix src/, escriu _site/) abans
  # de publicar-lo. Netlify executa aquesta ordre automàticament a
  # cada desplegament (via Git) — no cal fer-ho manualment.
  command = "npx eleventy"
  publish = "_site"
  functions = "netlify/functions"

# La pàgina "Història" s'ha renombrat a "Qui som" (2026-09-19).
# Redirects perquè els enllaços/marcadors antics no es trenquin.
[[redirects]]
  from = "/historia.html"
  to = "/qui-som.html"
  status = 301

[[redirects]]
  from = "/es/historia.html"
  to = "/es/qui-som.html"
  status = 301

[[redirects]]
  from = "/en/historia.html"
  to = "/en/qui-som.html"
  status = 301

# Programacions (àrea privada): no s'ha d'indexar ni desar a la memòria cau
[[headers]]
  for = "/programacions/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
